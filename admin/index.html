<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Administración | Cantina Los Cebollitas</title>

    <link rel="stylesheet" href="../css/admin.css">
</head>

<body>

    <main>
        <h1>Administración</h1>

        <p>Panel de administración de Cantina Los Cebollitas.</p>

        <section id="login">
            <h2>Iniciar sesión</h2>

            <form id="formLogin">
                <input
                    type="email"
                    id="email"
                    placeholder="Correo electrónico"
                    required
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Contraseña"
                    required
                >

                <button type="submit">
                    Iniciar sesión
                </button>
            </form>

            <p id="mensajeLogin"></p>
        </section>

        <section id="panel" hidden>
            <h2>Sesión iniciada</h2>

            <p id="usuarioActual"></p>

            <button id="btnCerrarSesion">
                Cerrar sesión
            </button>
        </section>
    </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module" src="../js/admin.js"></script>

</body>
</html>
